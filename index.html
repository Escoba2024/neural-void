<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEURAL VOID // THE UNCHAINED WEB</title>
    <style>
        /* ============ DESIGN SYSTEM ============ */
        :root {
            --bg: #000000;
            --neon: #00FF41; /* Matrix Green */
            --neon-dim: #003b0f;
            --violet: #b026ff;
            --violet-glow: rgba(176, 38, 255, 0.6);
            --text: #cfeacf;
            --font-mono: 'JetBrains Mono', 'Fira Code', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-mono);
            overflow-x: hidden;
            min-height: 100vh;
            cursor: crosshair;
        }

        /* ============ BACKGROUND & OVERLAYS ============ */
        #matrix-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; opacity: 0.4;
        }

        .crt-overlay {
            pointer-events: none; position: fixed; inset: 0; z-index: 999;
            background: repeating-linear-gradient(rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 1px, transparent 2px, transparent 2px);
            background-size: 100% 3px;
        }

        .vignette {
            pointer-events: none; position: fixed; inset: 0; z-index: 998;
            background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.8) 100%);
        }

        /* ============ UI COMPONENTS ============ */
        main {
            max-width: 1000px; margin: 0 auto; padding: 40px 20px;
            display: flex; flex-direction: column; align-items: center;
        }

        header { width: 100%; display: flex; justify-content: space-between; font-size: 10px; color: var(--neon-dim); border-bottom: 1px solid var(--neon-dim); padding-bottom: 5px; margin-bottom: 50px; }

        .logo {
            font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 900; letter-spacing: 0.2em;
            color: var(--neon); text-shadow: 0 0 10px var(--neon);
            position: relative; margin-bottom: 10px;
        }

        .tagline { font-size: 14px; color: var(--violet); letter-spacing: 0.3em; margin-bottom: 40px; min-height: 1.5em; }

        /* SEARCH AREA */
        .search-container { width: 100%; max-width: 700px; position: relative; }
        
        .search-bar {
            width: 100%; background: rgba(0, 20, 0, 0.8); border: 1px solid var(--neon);
            padding: 15px 20px; color: var(--neon); font-family: var(--font-mono);
            font-size: 18px; outline: none; box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
        }

        .tabs { display: flex; gap: 15px; margin-top: 15px; justify-content: center; }
        .tab-btn {
            background: transparent; border: 1px solid var(--neon-dim); color: var(--neon-dim);
            padding: 5px 15px; font-size: 12px; cursor: pointer; transition: 0.3s;
        }
        .tab-btn.active { border-color: var(--violet); color: var(--violet); box-shadow: 0 0 8px var(--violet); }
        .tab-btn:hover { border-color: var(--neon); color: var(--neon); }

        /* RESULTS */
        #results-area { width: 100%; margin-top: 50px; }
        .decrypt-log { font-size: 12px; color: var(--neon); margin-bottom: 20px; border-left: 2px solid var(--neon); padding-left: 10px; display: none; }
        
        /* Web View */
        .result-item { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(0, 255, 65, 0.1); }
        .result-item a { color: var(--neon); font-size: 18px; text-decoration: none; display: block; margin-bottom: 5px; }
        .result-item cite { color: var(--violet); font-size: 11px; font-style: normal; }
        .result-item p { color: #888; font-size: 14px; margin-top: 5px; }

        /* Image Grid */
        .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .image-card { background: #111; border: 1px solid var(--neon-dim); overflow: hidden; height: 180px; transition: 0.3s; cursor: pointer; }
        .image-card:hover { border-color: var(--neon); transform: scale(1.02); }
        .image-card img { width: 100%; height: 100%; object-fit: cover; }

        /* GLITCH ANIMATION */
        .glitch { animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite; }
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }

        @media (max-width: 600px) {
            .tabs { flex-wrap: wrap; }
            .image-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>
<div class="crt-overlay"></div>
<div class="vignette"></div>

<main>
    <header>
        <span>STATUS: ENCRYPTED // NODE_441</span>
        <span id="utc-clock">00:00:00 UTC</span>
    </header>

    <h1 class="logo" id="main-logo">NEURAL VOID</h1>
    <div class="tagline" id="typing-tagline"></div>

    <div class="search-container">
        <form id="search-form">
            <input type="text" id="query-input" class="search-bar" placeholder="Enter query..." autocomplete="off">
            <div class="tabs">
                <button type="button" class="tab-btn active" data-cat="general">WEB</button>
                <button type="button" class="tab-btn" data-cat="images">IMAGES</button>
                <button type="button" class="tab-btn" data-cat="videos">VIDEO</button>
                <button type="button" class="tab-btn" data-cat="news">NEWS</button>
            </div>
        </form>
    </div>

    <div id="results-area">
        <div id="log" class="decrypt-log"></div>
        <div id="display"></div>
    </div>
</main>

<script>
    /* ============ CONFIG ============ */
    const SEARX_INSTANCE = "https://searx.be/search"; // Kostenlose öffentliche Instanz
    let currentCategory = "general";

    /* ============ MATRIX CANVAS ============ */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "01";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array.from({ length: columns }).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#00FF41";
        ctx.font = fontSize + "px monospace";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 50);

    /* ============ UI LOGIC ============ */
    // Clock
    setInterval(() => {
        document.getElementById('utc-clock').innerText = new Date().toLocaleTimeString() + " UTC";
    }, 1000);

    // Tagline Typing
    const tagline = "ACCESS THE UNCHAINED WEB. NO FILTERS.";
    let charIndex = 0;
    function typeEffect() {
        if (charIndex < tagline.length) {
            document.getElementById('typing-tagline').innerHTML += tagline.charAt(charIndex);
            charIndex++;
            setTimeout(typeEffect, 100);
        }
    }
    typeEffect();

    // Tab Switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelector('.tab-btn.active').classList.remove('active');
            btn.classList.add('active');
            currentCategory = btn.dataset.cat;
        });
    });

    /* ============ SEARCH LOGIC ============ */
    const form = document.getElementById('search-form');
    const display = document.getElementById('display');
    const log = document.getElementById('log');

    form.onsubmit = async (e) => {
        e.preventDefault();
        const query = document.getElementById('query-input').value;
        if (!query) return;

        // Visual Reset
        display.innerHTML = "";
        log.style.display = "block";
        document.getElementById('main-logo').classList.add('glitch');
        
        // Decryption Animation
        log.innerHTML = "> INITIATING BYPASS...<br>";
        await sleep(400);
        log.innerHTML += "> TUNNELING THROUGH YANDEX_INDEX...<br>";
        await sleep(600);
        log.innerHTML += `> DECRYPTING ${currentCategory.toUpperCase()} STREAM FOR: "${query}"...<br>`;

        try {
            const results = await fetchResults(query, currentCategory);
            renderResults(results, currentCategory);
        } catch (err) {
            log.innerHTML += "> ERROR: VOID_CONNECTION_INTERRUPTED";
        } finally {
            document.getElementById('main-logo').classList.remove('glitch');
        }
    };

async function fetchResults(q, cat) {
    const targetUrl = `${SEARX_INSTANCE}?q=${encodeURIComponent(q)}&categories=${cat}&format=json&safesearch=0&language=de-DE`;
    
    // Wir nutzen einen kostenlosen Proxy, um die CORS-Sperre zu umgehen
    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

    try {
        const resp = await fetch(proxyUrl);
        if (!resp.ok) throw new Error('NETWORK_RESPONSE_NOT_OK');
        const data = await resp.json();
        return data.results;
    } catch (err) {
        console.error("Void Error:", err);
        // Falls der Proxy mal streikt, versuchen wir es mit einer anderen Instanz
        log.innerHTML += "> WARNING: PRIMARY_NODE_BLOCKED. ATTEMPTING_RECOVERY...<br>";
        return [];
    }
}

    function renderResults(data, cat) {
        log.innerHTML += "> ACCESS GRANTED. DISPLAYING DATA.";
        if (cat === "images") {
            let html = '<div class="image-grid">';
            data.forEach(item => {
                if (item.img_src) {
                    html += `<div class="image-card"><img src="${item.img_src}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>`;
                }
            });
            html += '</div>';
            display.innerHTML = html;
        } else {
            let html = '';
            data.forEach(item => {
                html += `
                <div class="result-item">
                    <a href="${item.url}" target="_blank">${item.title}</a>
                    <cite>${item.url}</cite>
                    <p>${item.content || 'No description available.'}</p>
                </div>`;
            });
            display.innerHTML = html;
        }
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
</script>

</body>
</html>
